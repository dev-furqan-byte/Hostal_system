<h2>Login</h2>

<form method="POST" autocomplete="off">
    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="off"
        required>

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="new-password"
        required>

    <br><br>

    <button type="submit">Login</button>
</form>




    <a href= "{% url 'signup' %}"><button type="submit">Signup</button><a>

<!DOCTYPE html>
<html>
<head>
    <title>Hostel Management System</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
        }

        nav{
            background:#0d6efd;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-right:20px;
            font-weight:bold;
        }

        nav a:hover{
            color:yellow;
        }

        .container{
            padding:20px;
        }

    </style>

</head>
<body>

<nav>

    <a href="{% url 'dashboard' %}">Dashboard</a>

    <a href="{% url 'room_list' %}">Rooms</a>

    <a href="{% url 'boys_list' %}">Boys</a>

    <a href="{% url 'payment_list' %}">Payments</a>

    <a href="{% url 'add_boy' %}">Add Boy</a>

    <a href="{% url 'add_payment' %}">Add Payment</a>



{% if request.user.is_authenticated  %}
    <a href="{% url 'logout' %}">Logout</a>
{% else %}
    <a href="{% url 'login'%}">login</a>
    <a href="{% url 'signup'%}">signup</a>
{% endif %}


</nav>

<div class="container">

{% block content %}

{% endblock %}

</div>

</body>
</html>
